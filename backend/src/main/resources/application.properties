# Application name (shows up in logs)
spring.application.name=enviro365-withdrawal-backend

# --- Server ---
server.port=8080

# --- H2 in-memory database ---
# "jdbc:h2:mem:enviro365db" means the DB lives only in memory and resets
# every time the app restarts - fine for this assessment, DataLoader
# re-seeds it on every startup.
spring.datasource.url=jdbc:h2:mem:enviro365db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets us open a web-based DB browser at http://localhost:8080/h2-console
# Under "JDBC URL" use exactly: jdbc:h2:mem:enviro365db
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# "update": Hibernate creates/updates tables to match our @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
# Prints the generated SQL to the console - useful for learning what JPA is doing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Keeps the Hibernate session open while Spring converts entities to JSON,
# so fields like Investor.products (loaded lazily) can still be read
# without throwing a "no session" error. This is on by default, but we
# set it explicitly so it's clear why entity responses "just work".
spring.jpa.open-in-view=true

# --- JSON output ---
# Without this, dates/times can serialize as confusing number arrays
# like [2026,9,10,14,30,0]. This makes them clean ISO-8601 strings instead,
# e.g. "2026-09-10T14:30:00".
spring.jackson.serialization.write-dates-as-timestamps=false
